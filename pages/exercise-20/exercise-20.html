<body id="exercise20">

    <div class="container">

        <div class="voltar">
            <a href="../../index.html">Voltar para Home</a>
        </div>

        <h1>Página com Botões</h1>

        <div class="action">
            <h2>Cadastrar</h2>
            <p>Utilize este botão para cadastrar um novo item.</p>
            <button type="button" onclick="mostrarMensagem('Cadastro realizado!')">
                Cadastrar
            </button>
        </div>

        <div class="action">
            <h2>Editar</h2>
            <p>Utilize este botão para editar um item existente.</p>
            <button type="button">
                Editar
            </button>
        </div>

        <div class="action">
            <h2>Excluir</h2>
            <p>Utilize este botão para excluir um item.</p>
            <button type="button">
                Excluir
            </button>
        </div>

        <div class="action">
            <h2>Voltar</h2>
            <p>Utilize este botão para retornar à página inicial.</p>
            <button type="button" onclick="window.location.href='../../index.html'">
                Voltar
            </button>
        </div>

        <p id="mensagem"></p>

    </div>

    <script>
        function mostrarMensagem(mensagem) {
            document.getElementById("mensagem").textContent = mensagem;
        }
    </script>

</body>
