<body id="exercise16">

    <div class="container">

        <div class="voltar">
            <a href="../../index.html">Voltar para Home</a>
        </div>

        <h1>Elementos Block e Inline</h1>

        <!-- Elementos block ocupam toda a largura disponível e começam em uma nova linha. -->

        <div class="block">
            <h2>Elementos Block</h2>

            <p>
                Este é um parágrafo. O elemento
                <strong>p</strong> é um elemento block.
            </p>

            <div>
                Este <strong>div</strong> também é um elemento block.
            </div>
        </div>

        <!-- Elementos inline ocupam apenas o espaço necessário e permanecem na mesma linha. -->

        <div class="inline">
            <h2>Elementos Inline</h2>

            <p>
                Este texto possui
                <span>span</span>,
                <strong>strong</strong>
                e
                <a href="https://www.w3schools.com/" target="_blank">
                    link
                </a>
                como exemplos de elementos inline.
            </p>
        </div>

    </div>

</body>
